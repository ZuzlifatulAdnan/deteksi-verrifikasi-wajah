<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi — FaceVerify</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --base: #060C18; --void: #03060C; --panel: #0D1526; --border: #152035;
  --teal: #00C2A8; --green: #10b981; --green2: #059669;
  --blue: #3b82f6; --blue2: #2563eb;
  --red: #ef4444; --amber: #f59e0b; --purple: #8b5cf6;
  --text: #e2e8f0; --muted: #64748b;
  --oval-w: 240px; --oval-h: 240px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--base);
  background-image: radial-gradient(circle at 1px 1px, rgba(0,194,168,0.04) 1px, transparent 0);
  background-size: 24px 24px;
  color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
}

/* HEADER */
header {
  background: rgba(6,12,24,0.96); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
}
.logo {
  display: flex; align-items: center; gap: 0;
  font-family: 'Space Grotesk', sans-serif; font-weight: 700;
  font-size: 1.1rem; letter-spacing: 0.06em; color: var(--teal); text-decoration: none;
}
.logo-word span { color: var(--text); }
.logo-sep { color: var(--border); padding: 0 .5rem; font-weight: 300; }
.logo-sub { font-family: 'JetBrains Mono', monospace; font-size: .72rem; font-weight: 400; color: var(--muted); letter-spacing: 0.04em; }
.header-right { display: flex; align-items: center; gap: 16px }
.clock-display { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 600; color: var(--text); }
.date-display { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--muted); }
.header-nav a {
  color: var(--muted); text-decoration: none; font-size: .75rem;
  font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em;
  padding: 6px 10px; border-radius: 2px; transition: all .15s;
}
.header-nav a:hover { background: var(--panel); color: var(--text); }

/* MAIN LAYOUT */
main {
  flex: 1; display: grid; grid-template-columns: minmax(300px, 400px) 1fr;
  gap: 24px; max-width: 1300px; width: 100%; margin: 0 auto; padding: 24px 16px; align-items: start;
}

/* CAMERA PANEL */
.camera-panel {
  background: var(--panel); border: 1px solid var(--border); overflow: hidden;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  display: flex; flex-direction: column;
}
.panel-title {
  font-family: 'JetBrains Mono', monospace; font-size: .65rem; font-weight: 600;
  padding: 16px 20px 0; color: var(--muted); text-transform: uppercase; letter-spacing: .1em;
}
.camera-wrap {
  position: relative; margin: 16px 20px; overflow: hidden;
  background: #000; aspect-ratio: 4/5;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
.overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; pointer-events: none;
}
.oval-container { position: relative; width: var(--oval-w); height: var(--oval-h); }
#ovalBg { position: absolute; inset: 0; border: 2px solid rgba(0,194,168,.2); border-radius: 50%; }
svg.arc {
  position: absolute; inset: -6px;
  width: calc(100% + 12px); height: calc(100% + 12px); overflow: visible;
}
.hint-text {
  position: absolute; bottom: -36px; left: 50%; transform: translateX(-50%);
  white-space: nowrap; font-size: .72rem; font-weight: 500;
  color: rgba(255,255,255,.75); letter-spacing: .04em; text-align: center;
  font-family: 'JetBrains Mono', monospace;
}
.countdown-ring {
  position: absolute; bottom: -60px; left: 50%; transform: translateX(-50%);
  font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 700;
  color: var(--teal); opacity: 0; transition: opacity .3s;
}
.mask-top, .mask-bottom {
  position: absolute; left: 0; right: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
}
.mask-top { top: 0; height: 60px; border-bottom: 1px solid rgba(255,255,255,.04) }
.mask-bottom { bottom: 0; height: 70px; border-top: 1px solid rgba(255,255,255,.04) }
.cam-status {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.75); backdrop-filter: blur(10px);
  padding: 6px 16px; font-size: .72rem; font-weight: 500; color: #fff;
  white-space: nowrap; transition: all .3s; pointer-events: none;
  font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em;
}
.cam-status.green { background: rgba(16,185,129,.85) }
.cam-status.red   { background: rgba(239,68,68,.85) }
.cam-status.blue  { background: rgba(59,130,246,.85) }
.cam-status.amber { background: rgba(245,158,11,.85) }

/* MODE TABS */
.mode-tabs {
  display: flex; margin: 0 20px 16px; overflow: hidden;
  background: var(--void); border: 1px solid var(--border);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.mode-tab {
  flex: 1; border: none; background: transparent; color: var(--muted);
  padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: .72rem;
  font-weight: 600; cursor: pointer; transition: all .15s; letter-spacing: 0.06em;
}
.mode-tab.active { background: var(--teal); color: var(--void); }

/* ACTION BUTTON */
.btn-capture {
  display: block; margin: 0 20px 20px; width: calc(100% - 40px);
  padding: 14px; border: none; font-family: 'JetBrains Mono', monospace;
  font-size: .85rem; font-weight: 700; cursor: pointer; transition: all .2s; letter-spacing: 0.08em;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.btn-masuk  { background: var(--teal); color: var(--void); }
.btn-masuk:hover { background: #00dfc0; }
.btn-keluar { background: var(--blue); color: #fff; }
.btn-keluar:hover { background: var(--blue2); }
.btn-capture:disabled { opacity: .5; cursor: not-allowed; }

/* RIGHT PANEL */
.right-panel { display: flex; flex-direction: column; gap: 20px }

/* STATS ROW */
.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--border); overflow: hidden;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.stat-card { background: var(--panel); padding: 16px 20px; }
.stat-label {
  font-family: 'JetBrains Mono', monospace; font-size: .62rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px;
}
.stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; }
.stat-value.green  { color: var(--teal); }
.stat-value.blue   { color: var(--blue); }
.stat-value.purple { color: var(--purple); }

/* RESULT CARD */
.result-card {
  background: var(--panel); border: 1px solid var(--border);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  padding: 24px; text-align: center; display: none; animation: fadeSlideUp .3s ease;
}
.result-card.show { display: block }
@keyframes fadeSlideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.result-icon { font-size: 3.5rem; margin-bottom: 12px }
.result-name { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 4px }
.result-uid  { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--muted); margin-bottom: 12px }
.result-msg  { font-size: .9rem; color: var(--muted); margin-bottom: 16px; line-height: 1.5 }
.result-time {
  font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 600;
  background: var(--void); border: 1px solid var(--border); padding: 10px 16px; display: inline-block;
}
.result-sim  { font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: var(--muted); margin-top: 8px }
.result-card.success { border-color: rgba(0,194,168,.3) }
.result-card.failed  { border-color: rgba(239,68,68,.3) }

/* LOG TABLE */
.log-card {
  background: var(--panel); border: 1px solid var(--border); overflow: hidden; flex: 1;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}
.log-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-bottom: 1px solid var(--border);
}
.log-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: .9rem; font-weight: 600; }
.log-refresh {
  background: var(--void); border: 1px solid var(--border); color: var(--muted);
  padding: 5px 10px; font-family: 'JetBrains Mono', monospace; font-size: .68rem;
  cursor: pointer; transition: .15s; letter-spacing: 0.06em;
}
.log-refresh:hover { color: var(--text); border-color: var(--teal); }
.log-table-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: .8rem }
th {
  text-align: left; padding: 10px 16px; color: var(--muted); font-weight: 500;
  font-size: .62rem; text-transform: uppercase; letter-spacing: .08em;
  border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace;
}
td { padding: 11px 16px; border-bottom: 1px solid rgba(255,255,255,.03); vertical-align: middle }
tr:last-child td { border-bottom: none }
tr:hover td { background: rgba(0,194,168,.03) }
.badge {
  display: inline-block; font-family: 'JetBrains Mono', monospace;
  font-size: .62rem; font-weight: 600; padding: 2px 10px; letter-spacing: .04em;
}
.badge-masuk  { background: rgba(0,194,168,.1); color: var(--teal); border: 1px solid rgba(0,194,168,.2); }
.badge-keluar { background: rgba(59,130,246,.1); color: var(--blue); border: 1px solid rgba(59,130,246,.2); }
.empty-row td { text-align: center; color: var(--muted); padding: 24px; font-family: 'JetBrains Mono', monospace; font-size: .72rem; }

/* SPINNER */
#spinner {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); backdrop-filter: blur(4px); z-index: 100;
  align-items: center; justify-content: center; flex-direction: column; gap: 16px;
}
#spinner.show { display: flex }
.spin-ring { width: 56px; height: 56px; border: 4px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.spin-label { color: var(--muted); font-size: .82rem; font-family: 'JetBrains Mono', monospace; }

#snapCanvas, #motCanvas { display: none }

@media (max-width: 800px) {
  main { grid-template-columns: 1fr }
  .stats-row { grid-template-columns: repeat(2, 1fr) }
}
@media (max-width: 480px) {
  .stats-row { grid-template-columns: 1fr 1fr }
  header { padding: 0 12px }
  main { padding: 12px }
}
</style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-word"><span>FACE</span>VERIFY</div>
    <span class="logo-sep">/</span>
    <span class="logo-sub">Terminal Presensi</span>
  </a>
  <div class="header-right">
    <div>
      <div class="clock-display" id="clockEl">--:--:--</div>
      <div class="date-display" id="dateEl">--</div>
    </div>
    <div class="header-nav">
      <a href="/">Beranda</a>
      <a href="/register.html">Daftar</a>
      <a href="/verify.html">Verifikasi</a>
      <a href="/docs-integrasi.html">Integrasi</a>
    </div>
  </div>
</header>

<main>
  <div class="camera-panel">
    <div class="panel-title">// Kamera Presensi</div>

    <div class="camera-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div class="mask-top"></div>
      <div class="mask-bottom"></div>
      <div class="overlay">
        <div class="oval-container">
          <div id="ovalBg"></div>
          <svg class="arc" viewBox="0 0 252 252">
            <circle id="arcEl"
              cx="126" cy="126" r="120"
              fill="none" stroke="#00C2A8" stroke-width="4" stroke-linecap="round"
              pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"
              transform="rotate(-90 126 126)"
              style="display:none; transition: stroke-dashoffset .08s linear, stroke .3s"/>
          </svg>
          <div class="hint-text" id="hintText">Posisikan wajah dalam lingkaran</div>
          <div class="countdown-ring" id="cntdown"></div>
        </div>
      </div>
      <div class="cam-status" id="camStatus">Memulai kamera…</div>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" id="tabMasuk" onclick="setMode('masuk')">MASUK</button>
      <button class="mode-tab" id="tabKeluar" onclick="setMode('keluar')">KELUAR</button>
    </div>

    <button class="btn-capture btn-masuk" id="btnCapture" onclick="captureNow()">PRESENSI MASUK</button>
    <canvas id="snapCanvas"></canvas>
    <canvas id="motCanvas" width="64" height="48"></canvas>
  </div>

  <div class="right-panel">

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Masuk Hari Ini</div>
        <div class="stat-value green" id="statMasuk">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Keluar Hari Ini</div>
        <div class="stat-value blue" id="statKeluar">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Karyawan</div>
        <div class="stat-value purple" id="statTotal">—</div>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-name" id="resultName"></div>
      <div class="result-uid"  id="resultUid"></div>
      <div class="result-msg"  id="resultMsg"></div>
      <div class="result-time" id="resultTime"></div>
      <div class="result-sim"  id="resultSim"></div>
    </div>

    <div class="log-card">
      <div class="log-header">
        <h3>Presensi Hari Ini</h3>
        <button class="log-refresh" onclick="loadToday()">REFRESH</button>
      </div>
      <div class="log-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nama</th><th>Tipe</th><th>Waktu</th><th>Keyakinan</th>
            </tr>
          </thead>
          <tbody id="logBody">
            <tr class="empty-row"><td colspan="4">Memuat data…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<div id="spinner"><div class="spin-ring"></div><div class="spin-label" id="spinLabel">Memproses wajah…</div></div>

<script>
const API = '';   // same origin

// ---- Clock ----
function tick() {
  const now = new Date();
  document.getElementById('clockEl').textContent = now.toLocaleTimeString('id-ID');
  document.getElementById('dateEl').textContent  = now.toLocaleDateString('id-ID', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
tick(); setInterval(tick, 1000);

// ---- Camera ----
const video   = document.getElementById('video');
const snapCvs = document.getElementById('snapCanvas');
const motCvs  = document.getElementById('motCanvas');
const motCtx  = motCvs.getContext('2d');
const arcEl   = document.getElementById('arcEl');
const hintEl  = document.getElementById('hintText');
const cntdEl  = document.getElementById('cntdown');
const camStat = document.getElementById('camStatus');
const btnCap  = document.getElementById('btnCapture');

let stream, prevGray, holdTicks = 0, holdMax = 30;
let state = 'idle'; // idle | scanning | holding | capturing
let mode  = 'masuk';

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
    video.srcObject = stream;
    video.onloadedmetadata = () => { video.play(); setState('scanning') };
  } catch(e) {
    setStatus('Kamera tidak dapat diakses: ' + e.message, 'red');
  }
}

function setStatus(msg, cls='') {
  camStat.textContent = msg;
  camStat.className = 'cam-status' + (cls ? ' '+cls : '');
}

function setState(s) {
  state = s;
  arcEl.style.display = (s === 'holding' || s === 'capturing') ? 'block' : 'none';
  if (s === 'idle')     { setStatus('Memulai kamera…'); hintEl.textContent = 'Posisikan wajah dalam lingkaran'; cntdEl.style.opacity=0 }
  if (s === 'scanning') { setStatus('Hadapkan wajah ke kamera'); hintEl.textContent = 'Posisikan wajah dalam lingkaran' }
  if (s === 'holding')  { setStatus('Tahan diam…', 'amber'); hintEl.textContent = 'Jangan bergerak'; cntdEl.style.opacity=1 }
  if (s === 'capturing'){ setStatus('Memproses…', 'blue'); hintEl.textContent = '' }
}

function sampleGray() {
  motCtx.drawImage(video, 0, 0, 64, 48);
  const d = motCtx.getImageData(0,0,64,48).data;
  const g = new Uint8Array(64*48);
  for(let i=0;i<g.length;i++) g[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
  return g;
}

function motionDiff(a, b) {
  let s=0; for(let i=0;i<a.length;i++) s+=Math.abs(a[i]-b[i]);
  return s/a.length;
}

setInterval(() => {
  if (!stream || (state !== 'scanning' && state !== 'holding')) return;
  const cur = sampleGray();
  if (!prevGray) { prevGray = cur; return; }
  const diff = motionDiff(prevGray, cur);
  prevGray = cur;

  if (state === 'scanning') {
    if (diff < 14) { setState('holding'); holdTicks = 0 }
  } else if (state === 'holding') {
    if (diff > 14) { holdTicks = 0; setState('scanning'); arcEl.style.strokeDashoffset=100; cntdEl.style.opacity=0; return }
    holdTicks++;
    const pct = holdTicks / holdMax;
    arcEl.style.strokeDashoffset = 100 - pct * 100;
    cntdEl.textContent = Math.ceil((holdMax - holdTicks) * .08) + 's';
    if (holdTicks >= holdMax) {
      setState('capturing');
      captureNow();
    }
  }
}, 80);

function snapB64() {
  const { videoWidth: vw, videoHeight: vh } = video;
  snapCvs.width = vw || 640; snapCvs.height = vh || 480;
  const ctx = snapCvs.getContext('2d');
  ctx.translate(snapCvs.width, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0);
  return snapCvs.toDataURL('image/jpeg', 0.88);
}

// ---- Mode ----
function setMode(m) {
  mode = m;
  document.getElementById('tabMasuk').classList.toggle('active', m==='masuk');
  document.getElementById('tabKeluar').classList.toggle('active', m==='keluar');
  btnCap.textContent = m === 'masuk' ? 'PRESENSI MASUK' : 'PRESENSI KELUAR';
  btnCap.className = 'btn-capture ' + (m === 'masuk' ? 'btn-masuk' : 'btn-keluar');
}

// ---- Capture & Submit ----
async function captureNow() {
  if (state === 'capturing') {
    // already triggered by auto
  } else {
    setState('capturing');
  }
  const b64 = snapB64();
  showSpinner('Memverifikasi wajah…');
  btnCap.disabled = true;

  try {
    const fd = new FormData();
    fd.append('image_base64', b64);

    const url = `${API}/api/presensi/${mode}`;
    const res = await fetch(url, { method: 'POST', body: fd });
    const data = await res.json();
    hideSpinner();

    if (data.success) {
      showResult('success', data);
      setStatus(`${data.name} — ${mode==='masuk'?'Masuk':'Keluar'} tercatat`, 'green');
      loadStats();
      loadToday();
    } else {
      showResult('failed', data);
      setStatus(data.error || 'Gagal', 'red');
    }
  } catch(e) {
    hideSpinner();
    showResult('failed', { error: 'Error jaringan: ' + e.message });
    setStatus('Error jaringan', 'red');
  }

  // reset after 4 s
  setTimeout(() => {
    btnCap.disabled = false;
    holdTicks = 0;
    arcEl.style.strokeDashoffset = 100;
    cntdEl.style.opacity = 0;
    setState('scanning');
  }, 4000);
}

// ---- Result card ----
function showResult(type, data) {
  const card = document.getElementById('resultCard');
  card.className = 'result-card show ' + type;
  document.getElementById('resultIcon').className = 'result-icon';

  if (type === 'success') {
    document.getElementById('resultIcon').textContent = '✅';
    document.getElementById('resultName').textContent = data.name || '—';
    document.getElementById('resultUid').textContent  = 'ID: ' + (data.user_id || '—');
    document.getElementById('resultMsg').textContent  = data.message || '';
    document.getElementById('resultTime').textContent = data.waktu || new Date().toLocaleTimeString('id-ID');
    document.getElementById('resultSim').textContent  = `Kecocokan: ${data.similarity_pct || '—'}% — Keyakinan: ${data.confidence || '—'}`;
  } else {
    document.getElementById('resultIcon').textContent = '❌';
    document.getElementById('resultName').textContent = 'Gagal';
    document.getElementById('resultUid').textContent  = '';
    document.getElementById('resultMsg').textContent  = data.error || 'Verifikasi gagal';
    document.getElementById('resultTime').textContent = new Date().toLocaleTimeString('id-ID');
    document.getElementById('resultSim').textContent  = '';
  }
}

// ---- Spinner ----
function showSpinner(msg) {
  document.getElementById('spinLabel').textContent = msg;
  document.getElementById('spinner').classList.add('show');
}
function hideSpinner() {
  document.getElementById('spinner').classList.remove('show');
}

// ---- Stats ----
async function loadStats() {
  try {
    const res = await fetch(API + '/api/presensi/hari-ini');
    const json = await res.json();
    if (json.success && json.stats) {
      document.getElementById('statMasuk').textContent  = json.stats.masuk_hari_ini  ?? '—';
      document.getElementById('statKeluar').textContent = json.stats.keluar_hari_ini ?? '—';
      document.getElementById('statTotal').textContent  = json.stats.total_karyawan  ?? '—';
    }
  } catch(e) {}
}

// ---- Today's Log ----
async function loadToday() {
  try {
    const res = await fetch(API + '/api/presensi/hari-ini');
    const json = await res.json();
    const tbody = document.getElementById('logBody');
    if (!json.success || !json.data || json.data.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Belum ada presensi hari ini</td></tr>';
      return;
    }
    tbody.innerHTML = json.data.map(r => `
      <tr>
        <td>${r.name || r.user_id}</td>
        <td><span class="badge badge-${r.tipe}">${r.tipe.charAt(0).toUpperCase()+r.tipe.slice(1)}</span></td>
        <td>${r.waktu ? r.waktu.split(' ')[1] : '—'}</td>
        <td>${r.similarity ? (r.similarity*100).toFixed(1)+'%' : '—'}</td>
      </tr>
    `).join('');
  } catch(e) {
    document.getElementById('logBody').innerHTML = '<tr class="empty-row"><td colspan="4">Gagal memuat data</td></tr>';
  }
}

// ---- Init ----
startCamera();
loadStats();
loadToday();
setInterval(loadStats, 30000);
setInterval(loadToday, 15000);
</script>
